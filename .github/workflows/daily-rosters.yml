name: Daily NBA roster check
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-nba-rosters
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake HoopDuels and verify a recent successful roster update
        run: |
          node <<'JS'
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                const response = await fetch('https://hoopduels.com/api/players/data-status', {
                  signal: AbortSignal.timeout(30000)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const state = await response.json();
                const today = new Date().toISOString().slice(0, 10);
                if (state.teams === 30 && String(state.updatedAt).slice(0, 10) === today && !state.running && !state.lastError) {
                  console.log(`Verified all 30 NBA rosters. Last updated ${state.updatedAt}`);
                  return;
                }
                console.log('Waiting for roster refresh', state);
              } catch (error) {
                console.log(error.message);
              }
              await delay(30000);
            }
            throw new Error('Roster refresh did not succeed. The last working dataset remains active.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
