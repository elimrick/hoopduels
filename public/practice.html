  <body data-page="practice">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">HoopDuels</div>
        <nav class="nav">
          <a class="nav-link" data-nav="play" href="/">Play</a>
          <a class="nav-link" data-nav="leaderboard" href="/leaderboard">Leaderboard</a>
          <a class="nav-link" data-nav="history" href="/game-history">Game History</a>
          <a class="nav-link" data-nav="rules" href="/how-to-play">How to Play</a>
          <a class="nav-link" id="auth-nav-link" data-nav="signin" href="/signin">Sign In</a>
          <a class="nav-link" id="auth-nav-create" data-nav="createaccount" href="/create-account">Create Account</a>
          <a class="nav-link" id="auth-nav-profile" data-nav="profile" href="/profile">Profile</a>
        </nav>
      </aside>

      <main class="main">
        <div class="duel-page-header page-panel">
          <h1 class="page-title">Practice</h1>
          <button class="btn btn-status" id="leave-practice-btn" type="button">Leave Game</button>
        </div>

        <section class="card page-panel">
          <div class="duel-board practice-board">
            <div class="duel-player" id="practice-player-left">
              <div class="duel-player-name" id="practice-player-name">Player</div>
              <div class="duel-player-meta"><span class="duel-player-meta-label">Fouls:</span> <span id="practice-you-fouls">0</span>/3</div>
            </div>
            <div class="duel-center">
              <div class="duel-timer"><span id="practice-timer">60</span></div>
              <div class="duel-current"><span id="practice-current-player">-</span></div>
            </div>
            <div class="duel-player" id="practice-player-right">
              <div class="duel-player-name">Computer</div>
              <div class="duel-player-meta duel-player-meta-placeholder" aria-hidden="true">&nbsp;</div>
            </div>
          </div>
          <div id="practice-message" class="message"></div>
          <form autocomplete="off" data-form-type="other" onsubmit="return false;">
            <input type="text" tabindex="-1" aria-hidden="true" autocomplete="username" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none;" />
            <input type="password" tabindex="-1" aria-hidden="true" autocomplete="current-password" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none;" />
            <div class="turn-row" id="practice-guess-row">
              <textarea id="practice-guess-input" class="guess-input" rows="1" placeholder="Name a teammate..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-autocomplete="list" data-form-type="other" data-lpignore="true" data-1p-ignore="true"></textarea>
            </div>
          </form>
          <ul id="practice-history-list" class="history-list chain-list"></ul>
        </section>
      </main>
    </div>
    <script src="state.js?v=20260318h"></script>
    <script src="app.js?v=20260318h"></script>
    <script src="player-autocomplete.js?v=20260312a"></script>
    <script src="practice.js?v=20260318h"></script>
