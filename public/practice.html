  <body data-page="practice">
    <div class="grid-light" aria-hidden="true"></div>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand"><img class="brand-mark" src="/hoopduels-cyan-20261121.png" alt="" width="32" height="32"><span>HoopDuels</span></div>
        <nav class="nav">
          <a class="nav-link" data-nav="play" href="/">Play</a>
          <a class="nav-link" data-nav="friends" href="/friends">Friends</a>
          <a class="nav-link" data-nav="leaderboard" href="/leaderboard">Leaderboard</a>
          <a class="nav-link" data-nav="rules" href="/how-to-play">How to Play</a>
          <a class="nav-link" id="auth-nav-link" data-nav="signin" href="/signin">Sign In</a>
          <a class="nav-link" id="auth-nav-create" data-nav="createaccount" href="/create-account">Create Account</a>
          <a class="nav-link" id="auth-nav-profile" data-nav="profile" href="/profile">Profile</a>
        </nav>
      </aside>

      <main class="main arena-main" id="main-content">
        <div class="duel-page-header page-panel">
          <h1 class="page-title">Practice</h1>
          <button class="btn btn-status" id="leave-practice-btn" type="button">Leave Game</button>
        </div>

        <section class="card page-panel arena-card">
          <div class="duel-board practice-board">
            <div class="duel-player" id="practice-player-left">
              <div class="duel-player-heading"><span class="duel-player-name" id="practice-player-name">Player</span><span class="duel-player-elo" id="practice-player-elo"></span></div>
              <div class="duel-player-meta foul-meter" data-fouls="0" role="img" aria-label="0 of 3 fouls"><span class="foul-label" aria-hidden="true">Fouls</span><span id="practice-you-fouls" class="sr-only" aria-hidden="true">0</span><span class="foul-pips" aria-hidden="true"><span class="foul-pip"></span><span class="foul-pip"></span><span class="foul-pip"></span></span></div>
              <div class="duel-player-clock" id="practice-timer">1:00</div>
            </div>
            <div class="duel-center">
              <div class="duel-current"><span class="duel-current-label">CURRENT PLAYER</span><span class="duel-current-player" id="practice-current-player">-</span></div>
            </div>
            <div class="duel-player" id="practice-player-right">
              <div class="duel-player-heading"><span class="duel-player-name">Computer</span><span class="duel-player-elo" aria-label="Infinite rating">(∞)</span></div>
              <div class="duel-player-meta duel-player-meta-placeholder" aria-hidden="true">&nbsp;</div>
            </div>
          </div>
          <form autocomplete="off" data-form-type="other" onsubmit="return false;">
            <input type="text" tabindex="-1" aria-hidden="true" autocomplete="username" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none;" />
            <input type="password" tabindex="-1" aria-hidden="true" autocomplete="current-password" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none;" />
            <label class="search-label" for="practice-guess-input">Name a teammate</label><div class="turn-row" id="practice-guess-row">
              <textarea id="practice-guess-input" aria-label="Search NBA players" class="guess-input" rows="1" placeholder="Search..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-autocomplete="list" data-form-type="other" data-lpignore="true" data-1p-ignore="true"></textarea>
            </div>
          </form>
          <div id="practice-message" class="message" role="status" aria-live="polite"></div>
          <div class="chain-heading"><span class="eyebrow">THE CHAIN</span><span>Most recent first</span></div><ul id="practice-history-list" class="history-list chain-list"></ul>
        </section>

      <footer class="site-note"><span>HoopDuels</span> The NBA Chain Game</footer>
      </main>
    </div>
    <script src="game-feedback.js"></script>
