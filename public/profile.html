<!doctype html>
<html lang="en">
  <head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5273840321914189"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260318d" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260318d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260318b" />
    <title>Profile | HoopDuels</title>
    <script>document.documentElement.classList.add(localStorage.getItem("hoopduels_auth_token_v1") ? "auth-signed-in" : "auth-signed-out");</script>
    <style>#auth-nav-link,#auth-nav-create,#auth-nav-profile{display:none}html.auth-signed-out #auth-nav-link,html.auth-signed-out #auth-nav-create{display:flex}html.auth-signed-in #auth-nav-profile{display:flex}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260216f" />
  </head>
  <body data-page="profile">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">HoopDuels</div>
        <nav class="nav">
          <a class="nav-link" data-nav="play" href="/">Play</a>
          <a class="nav-link" data-nav="leaderboard" href="leaderboard.html">Leaderboard</a>
          <a class="nav-link" data-nav="history" href="game-history.html">Game History</a>
          <a class="nav-link" data-nav="rules" href="how-to-play.html">How to Play</a>
          <a class="nav-link" id="auth-nav-link" data-nav="signin" href="signin.html">Sign In</a>
          <a class="nav-link" id="auth-nav-create" data-nav="createaccount" href="create-account.html">Create Account</a>
          <a class="nav-link" id="auth-nav-profile" data-nav="profile" href="profile.html">Profile</a>
        </nav>
      </aside>

      <main class="main">
        <div class="profile-page-header">
          <h1 class="page-title profile-page-title" id="profile-page-title">Guest</h1>
          <p class="profile-joined-text">Joined: <strong id="profile-joined">-</strong></p>
        </div>

        <section class="card page-panel profile-elo-card">
          <div id="profile-elo-chart"></div>
        </section>

        <section class="card page-panel duel-card profile-stats-box">
          <div class="duel-header">
            <h2>Stats</h2>
          </div>
          <div class="stats">
            <div>
              <div class="stat-value" id="profile-rank">-</div>
              <div class="stat-label">Rating</div>
            </div>
            <div>
              <div class="stat-value" id="profile-wl">0-0</div>
              <div class="stat-label">W-L</div>
            </div>
            <div>
              <div class="stat-value" id="profile-streak">0</div>
              <div class="stat-label">Streak</div>
            </div>
            <div>
              <div class="stat-value" id="profile-peak-rank">-</div>
              <div class="stat-label">Peak Rating</div>
            </div>
            <div>
              <div class="stat-value" id="profile-best-win">-</div>
              <div class="stat-label">Best Win</div>
            </div>
            <div>
              <div class="stat-value" id="profile-longest-chain">0</div>
              <div class="stat-label">Longest Chain</div>
            </div>
          </div>
        </section>
        <button class="btn profile-signout-btn" id="signout-btn" type="button">Sign Out</button>
      </main>
    </div>
    <script src="state.js?v=20260216f"></script>
    <script src="app.js?v=20260216f"></script>
  </body>
</html>
