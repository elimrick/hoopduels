<!doctype html>
<html lang="en">
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow"  />
    <link rel="icon" type="image/x-icon" href="/favicon-20260326.ico"  />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"  />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon-20260326.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <meta name="apple-mobile-web-app-title" content="HoopDuels" />
    <title>Profile | HoopDuels</title>
    <script>document.documentElement.classList.add(localStorage.getItem("hoopduels_auth_token_v1") ? "auth-signed-in" : "auth-signed-out");</script>
    <style>#auth-nav-link,#auth-nav-create,#auth-nav-profile{display:none}html.auth-signed-out #auth-nav-link,html.auth-signed-out #auth-nav-create{display:flex}html.auth-signed-in #auth-nav-profile{display:flex}</style>



    <link rel="stylesheet" href="styles.css?v=redesign-1" />
  </head>
  <body data-page="profile">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M3 16h26M16 3v26M7 6c11 5 11 15 0 20M25 6c-11 5-11 15 0 20"/></svg><span>HoopDuels</span></div>
        <nav class="nav">
          <a class="nav-link" data-nav="play" href="/">Play</a>
          <a class="nav-link" data-nav="leaderboard" href="/leaderboard">Leaderboard</a>
          <a class="nav-link" data-nav="history" href="/game-history">Game History</a>
          <a class="nav-link" data-nav="rules" href="/how-to-play">How to Play</a>
          <a class="nav-link" id="auth-nav-link" data-nav="signin" href="/signin">Sign In</a>
          <a class="nav-link" id="auth-nav-create" data-nav="createaccount" href="/create-account">Create Account</a>
          <a class="nav-link" id="auth-nav-profile" data-nav="profile" href="/profile">Profile</a>
        </nav>
      </aside>

      <main class="main" id="main-content">
        <div class="profile-page-header">
          <h1 class="page-title profile-page-title" id="profile-page-title">Guest</h1>
          <p class="profile-joined-text">Joined: <strong id="profile-joined">-</strong></p>
        </div>

        <section class="card page-panel profile-elo-card">
          <div id="profile-elo-chart"></div>
        </section>

        <section class="card page-panel duel-card profile-stats-box">
          <div class="duel-header">
            <h2>Stats</h2>
          </div>
          <div class="stats">
            <div>
              <div class="stat-value" id="profile-rank">-</div>
              <div class="stat-label">Rating</div>
            </div>
            <div>
              <div class="stat-value" id="profile-wl">0-0</div>
              <div class="stat-label">W-L</div>
            </div>
            <div>
              <div class="stat-value" id="profile-streak">0</div>
              <div class="stat-label">Current Streak</div>
            </div>
            <div>
              <div class="stat-value" id="profile-peak-rank">-</div>
              <div class="stat-label">Peak Rating</div>
            </div>
            <div>
              <div class="stat-value" id="profile-best-win">-</div>
              <div class="stat-label">Best Win</div>
            </div>
            <div>
              <div class="stat-value" id="profile-longest-chain">0</div>
              <div class="stat-label">Longest Win Streak</div>
            </div>
          </div>
        </section>
        <button class="btn profile-signout-btn" id="signout-btn" type="button">Sign Out</button>
      <footer class="site-note"><span>HoopDuels</span> A game for people who know ball.</footer>
      </main>
    </div>
    <script src="state.js?v=20260318h"></script>
    <script src="app.js?v=20260318h"></script>
  </body>
</html>
