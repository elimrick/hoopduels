<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Create Account | HoopDuels</title>
    <script>document.documentElement.classList.add(localStorage.getItem("hoopduels_auth_token_v1") ? "auth-signed-in" : "auth-signed-out");</script>
    <style>#auth-nav-link,#auth-nav-create,#auth-nav-profile{display:none}html.auth-signed-out #auth-nav-link,html.auth-signed-out #auth-nav-create{display:flex}html.auth-signed-in #auth-nav-profile{display:flex}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260215v" />
  </head>
  <body data-page="createaccount">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">HoopDuels</div>
        <nav class="nav">
          <a class="nav-link" data-nav="play" href="/">Play</a>
          <a class="nav-link" data-nav="leaderboard" href="leaderboard.html">Leaderboard</a>
          <a class="nav-link" data-nav="history" href="game-history.html">Game History</a>
          <a class="nav-link" data-nav="rules" href="how-to-play.html">How to Play</a>
          <a class="nav-link" id="auth-nav-link" data-nav="signin" href="signin.html">Sign In</a>
          <a class="nav-link" id="auth-nav-create" data-nav="createaccount" href="create-account.html">Create Account</a>
          <a class="nav-link" id="auth-nav-profile" data-nav="profile" href="profile.html">Profile</a>
        </nav>
      </aside>

      <main class="main">
        <h1 class="page-title">Create Account</h1>
        <section class="card page-panel">
          <label for="signin-username">Username</label>
          <input id="signin-username" maxlength="24" placeholder="Choose username" style="margin: 8px 0 12px;" />
          <p id="signin-username-error" class="field-error"></p>
          <label for="signin-password">Password</label>
          <input id="signin-password" type="password" maxlength="72" placeholder="Create password" style="margin: 8px 0 12px;" />
          <p id="signin-password-error" class="field-error"></p>
          <div class="auth-actions">
            <button class="btn" id="signup-btn" type="button">Create Account</button>
          </div>
          <p id="signin-message" class="list-empty" style="margin-top: 10px;"></p>
        </section>
      </main>
    </div>
    <script src="state.js?v=20260215v"></script>
    <script src="app.js?v=20260215v"></script>
  </body>
</html>
