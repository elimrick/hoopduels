<!doctype html>
<html lang="en">
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow"  />




    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />

    <title>Create Account | HoopDuels</title>
    <script>document.documentElement.classList.add(localStorage.getItem("hoopduels_auth_token_v1") ? "auth-signed-in" : "auth-signed-out");</script>
    <style>#auth-nav-link,#auth-nav-create,#auth-nav-profile{display:none}html.auth-signed-out #auth-nav-link,html.auth-signed-out #auth-nav-create{display:flex}html.auth-signed-in #auth-nav-profile{display:flex}</style>



    <link rel="stylesheet" href="styles.css?v=redesign-1" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=1be45d2d">
</head>
  <body data-page="createaccount">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand"><img class="brand-mark" src="/logo.svg?v=1be45d2d" alt="" width="32" height="32"><span>HoopDuels</span></div>
        <nav class="nav">
          <a class="nav-link" data-nav="play" href="/">Play</a>
          <a class="nav-link" data-nav="friends" href="/friends">Friends</a>
          <a class="nav-link" data-nav="leaderboard" href="/leaderboard">Leaderboard</a>
          <a class="nav-link" data-nav="rules" href="/how-to-play">How to Play</a>
          <a class="nav-link" id="auth-nav-link" data-nav="signin" href="/signin">Sign In</a>
          <a class="nav-link" id="auth-nav-create" data-nav="createaccount" href="/create-account">Create Account</a>
          <a class="nav-link" id="auth-nav-profile" data-nav="profile" href="/profile">Profile</a>
        </nav>
      </aside>

      <main class="main" id="main-content">
        <header class="page-intro"><h1 class="page-title">Create Account</h1></header>
        <section class="card page-panel auth-page-panel">
          <div class="auth-form-stack">
            <label for="signin-username">Username</label>
            <input id="signin-username" maxlength="24" placeholder="Create username" class="auth-field-input" />
            <p id="signin-username-error" class="field-error"></p>
            <label for="signin-password">Password</label>
            <input id="signin-password" type="password" maxlength="72" placeholder="Create password" class="auth-field-input" />
            <p id="signin-password-error" class="field-error"></p>
            <div class="auth-actions">
              <button class="btn" id="signup-btn" type="button">Create Account</button>
            </div>
            <p id="signin-message" class="list-empty auth-message"></p>
          </div>
        <p class="auth-switch">Already have an account? <a href="/signin">Sign in</a></p></section>

      <footer class="site-note"><span>HoopDuels</span> The NBA Teammate Chain Game</footer>
      </main>
    </div>
    <script src="state.js?v=20260318h"></script>
    <script src="app.js?v=20260318h"></script>
  </body>
</html>
