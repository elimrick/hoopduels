<!doctype html>
<html lang="en">
  <head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5273840321914189"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260318d" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260318d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260318b" />
    <title>Play Duel | HoopDuels</title>
    <script>document.documentElement.classList.add(localStorage.getItem("hoopduels_auth_token_v1") ? "auth-signed-in" : "auth-signed-out");</script>
    <style>#auth-nav-link,#auth-nav-create,#auth-nav-profile{display:none}html.auth-signed-out #auth-nav-link,html.auth-signed-out #auth-nav-create{display:flex}html.auth-signed-in #auth-nav-profile{display:flex}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260216f" />
  </head>
  <body data-page="play">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">HoopDuels</div>
        <nav class="nav">
          <a class="nav-link" data-nav="play" href="/">Play</a>
          <a class="nav-link" data-nav="leaderboard" href="/leaderboard">Leaderboard</a>
          <a class="nav-link" data-nav="history" href="/game-history">Game History</a>
          <a class="nav-link" data-nav="rules" href="/how-to-play">How to Play</a>
          <a class="nav-link" id="auth-nav-link" data-nav="signin" href="/signin">Sign In</a>
          <a class="nav-link" id="auth-nav-create" data-nav="createaccount" href="/create-account">Create Account</a>
          <a class="nav-link" id="auth-nav-profile" data-nav="profile" href="/profile">Profile</a>
        </nav>
      </aside>

      <main class="main">
        <div class="duel-page-header page-panel">
          <h1 class="page-title">Live Duel</h1>
          <button class="btn btn-status" id="leave-game-btn" type="button">Leave Game</button>
        </div>

        <section class="card page-panel">
          <div class="duel-board">
            <div class="duel-player" id="player-left">
              <div class="duel-player-name" id="player-left-name">Player 1</div>
              <div class="duel-player-meta">Fouls: <span id="player-left-strikes">0</span>/3</div>
              <div class="duel-player-meta duel-player-elo" id="player-left-elo"></div>
            </div>
            <div class="duel-center">
              <div class="duel-timer"><span id="timer">60</span></div>
              <div class="duel-current"><span id="current-label"></span><span id="current-player">-</span></div>
            </div>
            <div class="duel-player" id="player-right">
              <div class="duel-player-name" id="player-right-name">Player 2</div>
              <div class="duel-player-meta">Fouls: <span id="player-right-strikes">0</span>/3</div>
              <div class="duel-player-meta duel-player-elo" id="player-right-elo"></div>
            </div>
          </div>
          <div id="message" class="message"></div>
          <form autocomplete="off" data-form-type="other" onsubmit="return false;">
            <input type="text" tabindex="-1" aria-hidden="true" autocomplete="username" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none;" />
            <input type="password" tabindex="-1" aria-hidden="true" autocomplete="current-password" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none;" />
            <div class="turn-row" id="guess-row">
              <textarea id="guess-input" class="guess-input" rows="1" placeholder="Name a teammate..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-autocomplete="list" data-form-type="other" data-lpignore="true" data-1p-ignore="true"></textarea>
              <div id="guess-display" class="guess-display" hidden aria-hidden="true"></div>
            </div>
          </form>
          <ul id="history-list" class="history-list chain-list"></ul>
        </section>
      </main>
    </div>

    <div class="matchmaking-overlay" id="leave-game-overlay" hidden>
      <div class="matchmaking-card">
        <h3>Leave Game?</h3>
        <p>If you confirm, it will count as a loss.</p>
        <div class="matchmaking-actions">
          <button class="btn" id="leave-game-confirm-btn" type="button">Confirm</button>
          <button class="btn btn-overlay-secondary" id="leave-game-cancel-btn" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <div class="matchmaking-overlay" id="matchmaking-overlay" hidden>
      <div class="matchmaking-card">
        <h3>Finding Game</h3>
        <p id="matchmaking-status">Connecting to matchmaking...</p>
        <div class="matchmaking-inline-row">
          <div class="loading-dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <button class="btn btn-overlay-secondary btn-overlay-inline" id="cancel-matchmaking-btn" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="state.js?v=20260216f"></script>
    <script src="app.js?v=20260216f"></script>
    <script src="player-autocomplete.js?v=20260312a"></script>
    <script src="game.js?v=20260216f"></script>
  </body>
</html>
